[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headerhunter"
dynamic = ["version"]
description = "HTTPHeaderHunter - Defensive HTTP security-header auditor"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "HK101-cyber"}]
dependencies = [
    "httpx[http2]>=0.24,<1",
    "PyYAML>=6,<7",
    "rich>=13,<15",
]

[project.optional-dependencies]
test = [
    "pytest>=7,<9",
]

[project.scripts]
headerhunter = "headerhunter.cli:main"

[tool.setuptools.dynamic]
version = {attr = "headerhunter.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
headerhunter = ["data/*.yaml"]
